<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Choose a new password</title>
</head>
<body>
    <h1>Choose a new password</h1>

```
{% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Change password</button>
    </form>
{% else %}
    <p>This password reset link is invalid or has expired.</p>
{% endif %}

<p><a href="{% url 'login' %}">Back to login</a></p>
```

</body>
</html>
